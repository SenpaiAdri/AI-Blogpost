name: AI Comments

on:
  schedule:
    - cron: '30 1 * * 2,4,6'  # Tue/Thu/Sat 01:30 UTC → 09:30 PHT (offset after ingest)
  workflow_dispatch:  # Manual trigger (use for dry-run review first)

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ingest/requirements.txt

      - name: Run comment pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPENROUTER_PRIMARY_MODEL: ${{ secrets.OPENROUTER_PRIMARY_MODEL }}
          OPENROUTER_FALLBACK_MODEL: ${{ secrets.OPENROUTER_FALLBACK_MODEL }}
          COMMENTS_MODEL: ${{ secrets.COMMENTS_MODEL }}
          COMMENTS_FALLBACK_MODEL: ${{ secrets.COMMENTS_FALLBACK_MODEL }}
          COMMENTS_MAX_TOKENS: ${{ secrets.COMMENTS_MAX_TOKENS }}
          COMMENTS_TEMPERATURE: ${{ secrets.COMMENTS_TEMPERATURE }}
          COMMENTS_SCORE_MAX_TOKENS: ${{ secrets.COMMENTS_SCORE_MAX_TOKENS }}
          COMMENTS_CONTEXT_CHARS: ${{ secrets.COMMENTS_CONTEXT_CHARS }}
          COMMENTS_LOOKBACK_HOURS: ${{ secrets.COMMENTS_LOOKBACK_HOURS }}
          COMMENTS_MAX_POSTS: ${{ secrets.COMMENTS_MAX_POSTS }}
          COMMENTS_MAX_COMMENTS: ${{ secrets.COMMENTS_MAX_COMMENTS }}
          COMMENTS_THRESHOLD: ${{ secrets.COMMENTS_THRESHOLD }}
          COMMENTS_MAX_CONSECUTIVE_ERRORS: ${{ secrets.COMMENTS_MAX_CONSECUTIVE_ERRORS }}
          COMMENTS_AUTHOR_NAME: ${{ secrets.COMMENTS_AUTHOR_NAME }}
          COMMENTS_DRY_RUN: ${{ secrets.COMMENTS_DRY_RUN }}
        run: python services/ingest/src/comments/runner.py

      - name: Report status
        if: always()
        run: |
          echo "Comment job completed at $(date)"
